# SpendPilot public demo - TLS termination + reverse proxy.
# Install to /etc/nginx/sites-available/spendpilot.conf and symlink into
# sites-enabled/. Certificate paths assume certbot --nginx; adjust if you
# install a cloud-issued certificate instead.

server {
    listen 80;
    listen [::]:80;
    server_name spendpilot.owain32380.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spendpilot.owain32380.cn;

    ssl_certificate     /etc/letsencrypt/live/spendpilot.owain32380.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spendpilot.owain32380.cn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Demo inputs are tiny; keep the public surface tight.
    client_max_body_size 1m;

    # Web UI + chat API: one FastAPI process serves index.html, /static
    # and /api/*. Production port is 8201 (8200 is taken on that host);
    # the app's local default is 8200.
    location / {
        proxy_pass         http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Self-hosted MCP server (Streamable HTTP). SSE responses need
    # buffering off and a generous read timeout.
    location /mcp {
        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }
}

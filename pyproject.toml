[project]
name = "spendlatch"
version = "0.3.0"
description = "The authorization boundary between an AI agent and a consequential action: mandate-gated MCP server + simulated Alexa+ web experience"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# mcp is a dev dependency, not an optional one: the MCP surface, the wire
# roundtrip and the authorization-boundary tests all need it. Keeping it
# optional made a green-looking checkout with a broken MCP surface.
dev = ["pytest>=8", "mcp>=1.12,<2"]
llm = ["strands-agents>=0.1", "boto3>=1.35"]  # LLM planner only; never in CI

[tool.setuptools]
packages = ["mcp_server", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose. The evidence-freshness gate compares the
          # commit time of each artifact against the commit time of the code it
          # describes; in a depth-1 clone every path resolves to the tip commit,
          # so that gate can never fail. It looked green in CI while a full
          # clone reported five stale artifacts.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The same eight steps a judge runs locally: byte-compile, pytest, the
      # sealed benchmark, an MCP roundtrip over the wire (a real client against
      # a real server subprocess), the whole-repo SHA256 integrity manifest,
      # evidence freshness (evidence must not predate the code it describes),
      # the recorded test count, and the submission copy.
      - name: Run all quality gates
        run: python run_checks.py
